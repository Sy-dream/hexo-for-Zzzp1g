  display_title: true
  # 褰撲笅鎷夐槄璇绘枃绔犳椂锛屾槸鍚﹀湪瀵艰埅鏉℃樉绀烘鍦ㄩ槄璇荤殑鏂囩珷鏍囬
  display_post_title: true
  # 婊氬姩鏃舵槸鍚﹁瀵艰埅鏍忓浐瀹氭偓娴湪缃戦〉椤堕儴 (鍚搁《鏁堟灉)
  fixed: false

# ==========================================
# 鑿滃崟閰嶇疆 (Menu Settings)
# ==========================================
# 鏍煎紡: 鑿滃崟鍚嶇О: 閾炬帴璺緞 || 鍥炬爣锟?(FontAwesome 鍥炬爣)
menu:
  Home (棣栭〉): / || fas fa-home
  Archives (褰掓。): /archives/ || fas fa-archive
  Tags (鏍囩): /tags/ || fas fa-tags
  Categories (鍒嗙被): /categories/ || fas fa-folder-open
  List (鍒楄〃)||fas fa-list:
    Music (闊充箰): /music/ || fas fa-music
    Movie (鐢靛奖): /movies/ || fas fa-video
  Link (鍙嬮摼): /friends/ || fas fa-link
  About (鍏充簬): /about/ || fas fa-heart

# --------------------------------------
# 浠ｇ爜鍧楄锟?(Code Blocks Settings)
# --------------------------------------

code_blocks:
  # 浠ｇ爜鍧椾富棰橀锟? darker (鏆楄壊) / pale night / light (浜壊) / ocean / false
  theme: darker
  # 鏄惁寮€锟?Mac 椋庢牸鐨勪唬鐮佹 (宸︿笂瑙掓湁绾㈤粍缁夸笁涓皬鍦嗙偣)
  macStyle: false
  # Code block height limit (unit: px)
  height_limit: 380
  word_wrap: false

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  shrink: false
  fullpage: true

# Social media links
# Formal:
#   icon: link || the description || color
social:
  fab fa-github: https://github.com/yourname || Github || '#24292e'
  fas fa-envelope: mailto:you@example.com || Email || '#4a7dbe'

# --------------------------------------
# 鍥惧儚璁剧疆 (Image Settings)
