# 缃戦〉鏈€搴曢儴鐨勮儗鏅浘锟?(濡傛灉寮€鍚垯浼氬湪椤佃剼澶勫彔鍔犱笂鑳屾櫙澶у浘)
footer_img: false

# 缃戠珯鐨勫叏灞€搴曞眰鑳屾櫙 (Global Website Background)
# 杩欓噷鍐冲畾浜嗛〉闈㈢殑鏈€閲屽眰搴曡壊/鑳屾櫙銆傚彲濉壊锟?(锟?#000) 鎴栬€呮槸鍥剧墖 URL銆傚鏋滃～鍏ユ暟缁勫垯姣忔鍒锋柊闅忔満閫夊彇锟?
