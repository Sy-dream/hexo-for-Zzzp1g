tag_per_img:

# 娉ㄦ剰锛氳繖閲屾槸鍗曚釜鍒嗙被 (category) 椤甸潰锛岃€屼笉鏄墍鏈夊垎绫荤洰褰曢〉锟?
category_img:

# 涓烘瘡涓垎绫诲崟鐙缃浘锟?(鏍煎紡锟?tag_per_img)
